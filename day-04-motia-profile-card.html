<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motia profile card</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:675px;background:#060918;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;
    font-family:"Helvetica Neue",Helvetica,Arial,"Liberation Sans",sans-serif;-webkit-font-smoothing:antialiased}
  .card{position:relative;width:440px;height:380px;border-radius:26px;background:#FFFFFF;overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.55),0 8px 24px rgba(0,0,0,.4)}
  .banner{position:absolute;left:0;top:0;right:0;height:156px;background:#0A112D;
    background:radial-gradient(ellipse 70% 90% at 50% 42%,#2B5BD9 0%,#16296B 38%,#091233 72%,#060918 100%)}
  .wordmark{position:absolute;left:0;right:0;top:56px;text-align:center;color:#FFFFFF;
    font-size:30px;font-weight:200;letter-spacing:.5px;line-height:1}
  .row{position:absolute;right:24px;bottom:16px;display:flex;align-items:center;gap:14px}
  .row svg{width:16px;height:16px;fill:#FFFFFF;opacity:.6;display:block}
  .follow{border:0;background:#FFFFFF;color:#000;font:600 13px/1 inherit;font-family:inherit;
    padding:9px 18px;border-radius:999px;cursor:pointer}
  .tile{position:absolute;left:24px;top:120px;width:72px;height:72px;border-radius:16px;background:#1F5BFF;
    display:flex;align-items:center;justify-content:center;color:#fff;
    font-size:44px;font-weight:600;line-height:1;padding-bottom:6px;box-shadow:0 8px 20px rgba(31,91,255,.35)}
  .bio{position:absolute;left:24px;right:24px;top:212px}
  .name{font-size:22px;font-weight:700;color:#000;line-height:1.2}
  .handle{font-size:14px;color:#6B7280;margin-top:2px}
  .line{font-size:14px;color:#000;margin-top:14px}
  .link{font-size:14px;color:#2B6CB0;margin-top:8px}
  .stats{margin-top:20px;font-size:13px;font-weight:600;color:#000}
  .stats span{color:#6B7280;font-weight:400}
</style>
</head>
<body>
  <div class="card">
    <div class="banner">
      <div class="wordmark">motia</div>
      <div class="row">
        <svg viewBox="0 0 24 24" aria-label="X"><path d="M18.2 2.5h3.3l-7.2 8.3 8.5 10.7h-6.7l-5.2-6.5-5.9 6.5H1.7l7.7-8.9L1.3 2.5h6.8l4.7 6 5.4-6zm-1.2 17h1.8L7.1 4.4H5.2z"/></svg>
        <svg viewBox="0 0 24 24" aria-label="LinkedIn"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9.75h4V21H3zM9.5 9.75h3.8v1.6h.05c.55-1 1.9-1.95 3.8-1.95 4 0 4.85 2.5 4.85 5.8V21h-4v-5.1c0-1.25 0-2.85-1.75-2.85s-2 1.35-2 2.75V21h-4z"/></svg>
        <svg viewBox="0 0 24 24" aria-label="Butterfly"><path d="M12 10.8c-1.087-2.114-4.046-6.053-6.798-7.995C2.566.944 1.561 1.266.902 1.565.139 1.908 0 3.08 0 3.768c0 .69.378 5.65.624 6.479.815 2.736 3.713 3.66 6.383 3.364-3.912.58-7.387 2.005-2.83 7.078 5.013 5.19 6.87-1.113 7.823-4.308.953 3.195 2.05 9.271 7.733 4.308 4.267-4.308 1.172-6.498-2.74-7.078 2.67.297 5.568-.628 6.383-3.364.246-.828.624-5.79.624-6.478 0-.69-.139-1.861-.902-2.206-.659-.298-1.664-.62-4.3 1.24C16.046 4.748 13.087 8.687 12 10.8z"/></svg>
        <button class="follow" type="button">Follow</button>
      </div>
    </div>
    <div class="tile">m</div>
    <div class="bio">
      <div class="name">Motia</div>
      <div class="handle">@motia</div>
      <div class="line">Design in motion.</div>
      <div class="link">motia.dev</div>
      <div class="stats">12.4K <span>Followers</span> &nbsp;·&nbsp; 248 <span>Following</span></div>
    </div>
  </div>
</body>
</html>
